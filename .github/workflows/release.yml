name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Git tag must match package.json version.' }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:desktop
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish update assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "releases/GD-Toolkit-Setup-$version-x64.exe"
          gh release create $env:GITHUB_REF_NAME $installer "$installer.blockmap" releases/latest.yml --verify-tag --draft --title "GD Toolkit v$version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
